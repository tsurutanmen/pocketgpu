name: RpcServer
# 文字起こしの WhisperKit と読み上げの TTSKit。Argmax の argmax-oss-swift で、MIT。版は 1.1.1 に固定する
# モデルはアプリに入れない。初回に iPhone が Hugging Face から落とす
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: "1.1.1"
  # 絵の Stable Diffusion を Core ML と Neural Engine で動かす。Apple の ml-stable-diffusion で、MIT。版は 1.1.1 に固定する
  # 置き場は github.com/apple/ml-stable-diffusion から移った。1.1.1 は swift-transformers に頼らない。main は 0.1.8 にきっちり頼る
  # モデルはアプリに入れない。PC から work/ai_apps/sd_push.py で送る
  StableDiffusion:
    url: https://github.com/apple-aiml-research/ml-stable-diffusion
    exactVersion: "1.1.1"
options:
  bundleIdPrefix: com.tsurutanmen
  deploymentTarget:
    iOS: "17.0"
targets:
  RpcServer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Vulkan の命令の受け手（PC 側のドライバは vk/icd）
      - path: vk/remote
        includes: ["server.c", "bw.c", "proto.h", "wire.h", "video.h"]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 計算の受け手
        CFBundleShortVersionString: "0.7.53"
        CFBundleVersion: "61"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: PC からの計算の依頼を受け取るために使います
        NSSpeechRecognitionUsageDescription: PC から送られた音声を文字にするために使います
        NSMicrophoneUsageDescription: PC の通話や録音で、この iPhone のマイクの音を使うために使用します
        NSCameraUsageDescription: この iPhone のカメラを PC のウェブカメラとして使うために使用します
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [metal]
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsurutanmen.iphonerpc
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/llama.cpp/ggml/include $(PROJECT_DIR)/MoltenVK/MoltenVK/include"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/libs $(PROJECT_DIR)/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64"
        OTHER_LDFLAGS: "-lggml -lggml-base -lggml-cpu -lggml-metal -lggml-rpc -lMoltenVK -lc++ $(PUMPKIN_LDFLAGS)"
        # マイクラのサーバー（Pumpkin・GPL-3.0）を入れるときだけ、自動ビルドが PUMPKIN_LDFLAGS と PUMPKIN_SWIFT_FLAG を渡す
        PUMPKIN_LDFLAGS: ""
        PUMPKIN_SWIFT_FLAG: ""
        # レイトレーシングの入った MoltenVK で組む試す用の IPA だけ、自動ビルドが MVK_RT_SWIFT_FLAG=MVK_RT を渡す（設定に切り替えが出る）
        MVK_RT_SWIFT_FLAG: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(PUMPKIN_SWIFT_FLAG) $(MVK_RT_SWIFT_FLAG)"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) GGML_MAX_NAME=160
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      # Sources/WhisperKitBridge.swift と TTSKitBridge.swift が canImport で使う。SpeakerKit と道具の argmax-cli は入れない
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: TTSKit
      # Sources/ImageGen.swift が canImport で使う。道具の StableDiffusionSample は入れない
      - package: StableDiffusion
        product: StableDiffusion
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      # MoltenVK が使う
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      # 窓に出すコマを JPEG に縮める（vk/remote/server.c）
      - sdk: ImageIO.framework
      # 窓に出すコマを H.264 に縮める（vk/remote/server.c）
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
