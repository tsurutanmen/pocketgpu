name: RpcServer
# 文字起こしの WhisperKit と読み上げの TTSKit。Argmax の argmax-oss-swift で、MIT。版は 1.1.1 に固定する
# モデルはアプリに入れない。初回に iPhone が Hugging Face から落とす
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: "1.1.1"
  # 絵の Stable Diffusion を Core ML と Neural Engine で動かす。Apple の ml-stable-diffusion で、MIT。版は 1.1.1 に固定する
  # 置き場は github.com/apple/ml-stable-diffusion から移った。1.1.1 は swift-transformers に頼らない。main は 0.1.8 にきっちり頼る
  # モデルはアプリに入れない。PC から work/ai_apps/sd_push.py で送る
  StableDiffusion:
    url: https://github.com/apple-aiml-research/ml-stable-diffusion
    exactVersion: "1.1.1"
options:
  bundleIdPrefix: com.tsurutanmen
  deploymentTarget:
    iOS: "17.0"
targets:
  RpcServer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # 古い iPhone 用の軽いアプリ PocketCam だけのファイル（C の関数の代わり・@main・Info.plist）は入れない
        excludes: ["Lite", "Lite/**"]
      # Vulkan の命令の受け手（PC 側のドライバは vk/icd）
      - path: vk/remote
        includes: ["server.c", "bw.c", "proto.h", "wire.h", "video.h"]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PocketGPU
        CFBundleShortVersionString: "0.7.72"
        CFBundleVersion: "80"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: PC からの計算の依頼を受け取るために使います
        NSSpeechRecognitionUsageDescription: PC から送られた音声を文字にするために使います
        NSMicrophoneUsageDescription: PC の通話や録音で、この iPhone のマイクの音を使うために使用します
        NSCameraUsageDescription: この iPhone のカメラを PC のウェブカメラとして使うために使用します
        # コントロールセンターのビデオエフェクトのポートレートとスタジオ照明を、このアプリのカメラでも使えるようにする。
        # iOS は VoIP のアプリ（UIBackgroundModes に voip）にだけ初めから効かせる。それ以外のアプリはこの鍵で入れる（AVCaptureDevice.h の説明）
        NSCameraPortraitEffectEnabled: true
        NSCameraStudioLightEnabled: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [metal]
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsurutanmen.iphonerpc
        # Sources/Assets.xcassets の AppIcon。xcodegen はこの名前を自分では入れないので、書かないとアイコンが白紙になる
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/llama.cpp/ggml/include $(PROJECT_DIR)/MoltenVK/MoltenVK/include"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/libs $(PROJECT_DIR)/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64"
        OTHER_LDFLAGS: "-lggml -lggml-base -lggml-cpu -lggml-metal -lggml-rpc -lMoltenVK -lc++ $(PUMPKIN_LDFLAGS)"
        # マイクラのサーバー（Pumpkin・GPL-3.0）を入れるときだけ、自動ビルドが PUMPKIN_LDFLAGS と PUMPKIN_SWIFT_FLAG を渡す
        PUMPKIN_LDFLAGS: ""
        PUMPKIN_SWIFT_FLAG: ""
        # レイトレーシングの入った MoltenVK で組む試す用の IPA だけ、自動ビルドが MVK_RT_SWIFT_FLAG=MVK_RT を渡す（設定に切り替えが出る）
        MVK_RT_SWIFT_FLAG: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(PUMPKIN_SWIFT_FLAG) $(MVK_RT_SWIFT_FLAG)"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) GGML_MAX_NAME=160
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      # Sources/WhisperKitBridge.swift と TTSKitBridge.swift が canImport で使う。SpeakerKit と道具の argmax-cli は入れない
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: TTSKit
      # Sources/ImageGen.swift が canImport で使う。道具の StableDiffusionSample は入れない
      - package: StableDiffusion
        product: StableDiffusion
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      # MoltenVK が使う
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      # 窓に出すコマを JPEG に縮める（vk/remote/server.c）
      - sdk: ImageIO.framework
      # 窓に出すコマを H.264 に縮める（vk/remote/server.c）
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
  # 古い iPhone（iOS 15・16。iPhone 8 など）用の軽いアプリ。iPhone を PC のウェブカメラとマイクとしてだけ使う。
  # 入れるのは CameraBridge.swift・AudioBridge.swift・Lang.swift・ScreenDimmer.swift（画面を暗くする・温度の色）と Sources/Lite だけ。GPU の機能・llama.cpp・MoltenVK・AI のパッケージは入れない。
  # PC 側は本体と同じ（USB の 50064 番と 50063 番）。組み方は ci/build_lite.sh（Codemagic の ios-lite）
  PocketCam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        includes: ["CameraBridge.swift", "AudioBridge.swift", "Lang.swift", "ScreenDimmer.swift"]
      # C の関数の代わり・画面・権限の文の日英（ja.lproj・en.lproj の InfoPlist.strings）
      - path: Sources/Lite
    info:
      path: Sources/Lite/Info.plist
      properties:
        CFBundleDisplayName: PocketCam
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        NSCameraUsageDescription: この iPhone のカメラを PC のウェブカメラとして使うために使用します
        # 本体と同じ：ビデオエフェクトのポートレートとスタジオ照明をこのアプリでも使えるようにする
        NSCameraPortraitEffectEnabled: true
        NSCameraStudioLightEnabled: true
        NSMicrophoneUsageDescription: PC の通話や録音で、この iPhone のマイクの音を使うために使用します
        NSLocalNetworkUsageDescription: Wi-Fi で PC からウェブカメラに接続できるようにするために使用します
        # 接続中は、画面を消してもほかのアプリに切り替えても、マイクとスピーカーを続ける（カメラは iOS が止める）
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsurutanmen.pocketcam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
